[project]
name = "omics-agent"
version = "0.1.0"
description = "Natural-language search for public omics datasets"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "fastembed>=0.9.0",
    "httpx",
    "mcp",
    "numpy>=2.4.6",
    "python-dotenv",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn",
]

[project.scripts]
omics = "omics_agent.cli:main"
omics-api = "omics_agent.api:main"
omics-mcp = "omics_agent.mcp_server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
